# main ブランチに push されたら、Cloudflare Workers に自動で deploy する
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".devcontainer/**"
  workflow_dispatch: # Actions 画面の「Run workflow」から手動でも実行できる

# 同時に複数の deploy が走らないようにする（新しいものを優先）
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Actions のシークレット CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
